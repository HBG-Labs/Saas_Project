<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dégradé du fond Cobalt / Saphir Royal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- Éclairage supérieur subtil -->
    <linearGradient id="topGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </linearGradient>

    <!-- Dégradés facettes du 'R' Architectural -->
    <!-- Fût vertical principal -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Boucle supérieure (Face éclairée) -->
    <linearGradient id="loopTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Biseau supérieur 45° -->
    <linearGradient id="bevelTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Biseau latéral droit -->
    <linearGradient id="bevelRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Jambe diagonale dynamique -->
    <linearGradient id="legGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Biseau d'ombrage inférieur jambe -->
    <linearGradient id="legShadeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Jonction horizontale intérieure -->
    <linearGradient id="innerBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Ombre portée douce sous le monogramme -->
    <filter id="logoShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Fond Squircle iOS / Android -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="115" fill="url(#topGlow)" />
  <rect width="508" height="508" x="2" y="2" rx="113" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3" />

  <!-- Monogramme 'R' Architectural ciselé -->
  <g filter="url(#logoShadow)">

    <!-- 1. FÛT VERTICAL GAUCHE -->
    <!-- Face principale du montant vertical -->
    <polygon
      points="132,126 196,126 196,386 132,386"
      fill="url(#stemGrad)"
    />
    <!-- Biseau supérieur montant vertical (angle 45°) -->
    <polygon
      points="132,126 196,126 172,150 132,150"
      fill="#ffffff"
      fill-opacity="0.9"
    />

    <!-- 2. BOUCLE SUPÉRIEURE GÉOMÉTRIQUE -->
    <!-- Bande horizontale supérieure -->
    <polygon
      points="196,126 324,126 356,158 356,188 296,188 196,188"
      fill="url(#bevelTopGrad)"
    />

    <!-- Angle supérieur droit et montant vertical droit de la boucle -->
    <polygon
      points="324,126 380,182 380,224 330,274 274,274 274,224 334,224 348,210 348,196 308,156 196,156 196,126"
      fill="url(#bevelRightGrad)"
    />

    <!-- Face frontale blanche de la boucle supérieure -->
    <polygon
      points="196,138 316,138 362,184 362,216 320,258 196,258"
      fill="url(#loopTopGrad)"
    />

    <!-- Espace négatif intérieur (fenêtre chamfered) -->
    <polygon
      points="196,178 288,178 316,206 316,218 284,250 196,250"
      fill="#1d4ed8"
      fill-opacity="0.95"
    />

    <!-- 3. JAMBE DIAGONALE DYNAMIQUE (STRUT 45°) -->
    <!-- Biseau d'ombrage inférieur pour relief 3D -->
    <polygon
      points="236,250 340,386 384,386 280,250"
      fill="url(#legShadeGrad)"
    />

    <!-- Face frontale de la jambe diagonale -->
    <polygon
      points="224,242 332,386 380,386 272,242"
      fill="url(#legGrad)"
    />

    <!-- Pointe biseautée d'arrivée à 45° sur la jambe -->
    <polygon
      points="332,386 380,386 380,364 348,364"
      fill="#ffffff"
    />

    <!-- 4. CONNECTEUR & FINITIONS ARCHITECTURALES -->
    <!-- Lame horizontale de jonction intermédiaire -->
    <polygon
      points="196,238 256,238 274,256 196,256"
      fill="url(#innerBarGrad)"
    />

    <!-- Biseau d'éclat lumineux d'angle (Highlight) -->
    <polygon
      points="132,126 160,126 196,162 196,176 146,126"
      fill="#ffffff"
      fill-opacity="0.8"
    />

  </g>
</svg>
