<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Le thème est posé AVANT le premier octet de rendu.

      `<html>` portait `class="dark"` en dur, et le thème réel n'était appliqué
      qu'une fois le bundle JavaScript chargé et exécuté : toute personne en
      thème clair voyait donc un écran bleu nuit pendant quelques centaines de
      millisecondes à chaque chargement à froid.

      Ce script est volontairement en ligne et synchrone. Un fichier externe
      serait téléchargé après le parsing du `<head>` — trop tard : le navigateur
      aurait déjà peint le fond.
    -->
    <script>
      (function () {
        try {
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
          }
          window.scrollTo(0, 0);
          window.addEventListener('beforeunload', function () {
            window.scrollTo(0, 0);
          });
        } catch (e) {}

        try {
          /* Clé dupliquée depuis THEME_STORAGE_KEY (src/features/theme/theme-context.ts).
             Un test la vérifie : voir src/features/theme/theme-script.test.ts. */
          /* Le repli sur l'ancien nom de marque est INDISPENSABLE ICI : ce
             script s'exécute avant tout module, donc avant que
             migrate-storage-keys.ts ait recopié la préférence. Sans lui, la
             première visite après le renommage repeint l'écran dans le mauvais
             thème — exactement le clignotement que ce script existe pour
             éviter. À retirer en même temps que la reprise, pas avant. */
          /* Le défaut du produit est CLAIR (preset signature « Atelier Jour »).
             Ce script lisait `prefers-color-scheme` en l'absence de choix : sur
             un système en sombre il peignait donc en sombre, avant que
             ThemeProvider ne rebascule en clair d'après le preset par défaut —
             le clignotement même que ce script existe pour éviter. Seul un
             choix explicite et mémorisé bascule désormais le premier rendu. */
          var stored =
            localStorage.getItem('rezo360-theme') || localStorage.getItem('nexoratech-theme');
          if (stored === 'dark') {
            document.documentElement.classList.add('dark');
          }
          var storedCompact = localStorage.getItem('pref_compact_mode');
          if (storedCompact === 'true') {
            document.documentElement.classList.add('compact-mode');
            document.documentElement.setAttribute('data-density', 'compact');
          }
        } catch (error) {
          /* Navigation privée stricte : le thème clair par défaut reste utilisable. */
        }
      })();
    </script>
    <!-- viewport-fit=cover : nécessaire pour exploiter env(safe-area-inset-*) sur iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      La barre du navigateur mobile suit le thème RÉEL de l'application.

      Ces deux balises suivaient `prefers-color-scheme`, c'est-à-dire le système
      et non le produit. Depuis que le défaut est clair quel que soit le
      système, un utilisateur en système sombre obtenait une application claire
      surmontée d'une barre d'adresse sombre. La valeur est désormais posée par
      le script ci-dessus, d'après le thème effectivement appliqué.
    -->
    <meta id="theme-color-meta" name="theme-color" content="#eef2f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="REZO360" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="REZO360 — boîte à outils technique pour les professionnels de la fibre, des réseaux et de l'électricité."
    />
    <!-- Polices auto-hébergées : voir les imports @fontsource de src/styles/index.css. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="REZO360" />
    <meta property="og:title" content="REZO360 — le cockpit des équipes terrain" />
    <meta
      property="og:description"
      content="Missions, interventions, comptes rendus, devis et parc matériel pour les professionnels de la fibre, des réseaux et de l'électricité."
    />
    <meta name="twitter:card" content="summary" />

    <title>REZO360</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
