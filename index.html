<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : nécessaire pour exploiter env(safe-area-inset-*) sur iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      La barre du navigateur mobile suit le thème.
      Une seule valeur sombre teintait la barre d'adresse en bleu nuit même en
      thème clair, ce qui coupait l'écran en deux sur Android.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
    <meta
      name="description"
      content="NexoraTech — boîte à outils technique pour les professionnels de la fibre, des réseaux et de l'électricité."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>NexoraTech</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
