<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Le thème est posé AVANT le premier octet de rendu.

      `<html>` portait `class="dark"` en dur, et le thème réel n'était appliqué
      qu'une fois le bundle JavaScript chargé et exécuté : toute personne en
      thème clair voyait donc un écran bleu nuit pendant quelques centaines de
      millisecondes à chaque chargement à froid.

      Ce script est volontairement en ligne et synchrone. Un fichier externe
      serait téléchargé après le parsing du `<head>` — trop tard : le navigateur
      aurait déjà peint le fond.
    -->
    <script>
      (function () {
        try {
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
          }
          window.scrollTo(0, 0);
          window.addEventListener('beforeunload', function () {
            window.scrollTo(0, 0);
          });
        } catch (e) {}

        try {
          /* Clé dupliquée depuis THEME_STORAGE_KEY (src/features/theme/theme-context.ts).
             Un test la vérifie : voir src/features/theme/theme-script.test.ts. */
          /* Le repli sur l'ancien nom de marque est INDISPENSABLE ICI : ce
             script s'exécute avant tout module, donc avant que
             migrate-storage-keys.ts ait recopié la préférence. Sans lui, la
             première visite après le renommage repeint l'écran dans le mauvais
             thème — exactement le clignotement que ce script existe pour
             éviter. À retirer en même temps que la reprise, pas avant. */
          /* Le défaut du produit est CLAIR (preset signature « Atelier Jour »).
             Ce script lisait `prefers-color-scheme` en l'absence de choix : sur
             un système en sombre il peignait donc en sombre, avant que
             ThemeProvider ne rebascule en clair d'après le preset par défaut —
             le clignotement même que ce script existe pour éviter. Seul un
             choix explicite et mémorisé bascule désormais le premier rendu. */
          var stored =
            localStorage.getItem('rezo360-theme') || localStorage.getItem('nexoratech-theme');
          if (stored === 'dark') {
            document.documentElement.classList.add('dark');
          }
          var storedCompact = localStorage.getItem('pref_compact_mode');
          if (storedCompact === 'true') {
            document.documentElement.classList.add('compact-mode');
            document.documentElement.setAttribute('data-density', 'compact');
          }
        } catch (error) {
          /* Navigation privée stricte : le thème clair par défaut reste utilisable. */
        }
      })();
    </script>
    <!-- viewport-fit=cover : nécessaire pour exploiter env(safe-area-inset-*) sur iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      La barre du navigateur mobile suit le thème RÉEL de l'application.

      Ces deux balises suivaient `prefers-color-scheme`, c'est-à-dire le système
      et non le produit. Depuis que le défaut est clair quel que soit le
      système, un utilisateur en système sombre obtenait une application claire
      surmontée d'une barre d'adresse sombre. La valeur est désormais posée par
      le script ci-dessus, d'après le thème effectivement appliqué.
    -->
    <meta id="theme-color-meta" name="theme-color" content="#f7f8fa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="REZO360" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      CE TEXTE DÉCRIT LE PRODUIT, PAS SON ORIGINE.

      Il annonçait « boîte à outils technique pour les professionnels de la
      fibre, des réseaux et de l'électricité » — ce qu'était REZO360 à ses
      débuts, et ce que la page d'accueil ne dit plus depuis longtemps : elle
      s'adresse aux « entreprises, artisans et professionnels de terrain », tous
      métiers confondus.

      L'écart n'était pas cosmétique. Cette phrase est ce que voit un artisan
      chauffagiste ou paysagiste dans un résultat de recherche et dans l'aperçu
      d'un lien partagé — donc AVANT d'arriver sur la page. Il y lisait une
      promesse qui ne le concernait pas, et n'avait aucune raison de cliquer.
    -->
    <meta
      name="description"
      content="Clients, interventions, planning, comptes rendus et facturation au même endroit. REZO360 est la plateforme tout-en-un des entreprises, artisans et professionnels de terrain."
    />
    <!-- Polices auto-hébergées : voir les imports @fontsource de src/styles/index.css. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!--
      iOS ignore une icône de démarrage au format SVG : cette ligne pointait
      vers `favicon.svg`, donc Safari retombait sur une capture de la page.
      Le PNG à fond perdu est le seul format qu'il accepte.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      L'APERÇU DE PARTAGE, QUI EST AUSSI CE QUE VOIT LE TRAFIC PUBLICITAIRE.

      Ces balises décident de ce qu'affichent Facebook, Instagram, Messenger,
      LinkedIn et WhatsApp quand un lien vers REZO360 est partagé — y compris
      les partages organiques que produisent les campagnes.

      `og:image` MANQUAIT. Un lien sans visuel s'affiche sur ces plateformes
      comme une ligne de texte grise : c'est un lien qu'on ne clique pas. Le
      format 1200 × 630 n'est pas indicatif, c'est le ratio 1.91:1 attendu ;
      toute autre proportion est recadrée, souvent au pire endroit. L'image est
      reconstruite par `scripts/generate-og-image.mjs`, à partir des couleurs,
      polices et visuels réels du produit.

      `twitter:card` valait `summary`, qui affiche une vignette carrée en marge
      du texte. `summary_large_image` donne le grand visuel.

      Les URL doivent être ABSOLUES : les plateformes ne résolvent pas les
      chemins relatifs, et un `/og-image.jpg` seul ne donne aucune image.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="REZO360" />
    <meta property="og:url" content="https://rezo360.com/" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Pilotez votre activité de terrain en toute simplicité" />
    <meta
      property="og:description"
      content="Clients, interventions, planning, comptes rendus et facturation au même endroit — pour les entreprises, artisans et professionnels de terrain."
    />
    <meta property="og:image" content="https://rezo360.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="REZO360 affiché sur un ordinateur portable et un téléphone : tableau de bord des missions et des interventions."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pilotez votre activité de terrain en toute simplicité" />
    <meta
      name="twitter:description"
      content="Clients, interventions, planning, comptes rendus et facturation au même endroit."
    />
    <meta name="twitter:image" content="https://rezo360.com/og-image.jpg" />

    <!--
      Ne jamais exposer l'interface HTML brute.

      Ce filet vit directement dans `index.html`, donc il fonctionne même si
      le bundle JavaScript de l'application n'a pas encore démarré. Le marqueur
      `--app-styles-ready` est défini par la feuille principale : tant qu'il
      n'est pas lisible, seul cet écran léger est affiché.
    -->
    <style>
      html:not(.rezo360-styles-ready) #root {
        visibility: hidden;
      }

      #rezo360-style-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 24px;
        background: #f7f8fa;
        color: #243247;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      html.rezo360-styles-ready.rezo360-app-ready #rezo360-style-boot {
        display: none;
      }

      .rezo360-style-boot-card {
        width: min(100%, 360px);
        box-sizing: border-box;
        padding: 28px 24px;
        border: 1px solid #e2e6ec;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 10px 30px rgb(36 50 71 / 8%);
        text-align: center;
      }

      .rezo360-style-boot-logo {
        margin: 0 0 12px;
        color: #2451d1;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }

      .rezo360-style-boot-message {
        margin: 0;
        color: #657185;
        font-size: 15px;
        line-height: 1.5;
      }

      #rezo360-style-retry {
        display: none;
        width: 100%;
        margin-top: 18px;
        padding: 12px 18px;
        border: 0;
        border-radius: 999px;
        background: #2451d1;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      #rezo360-style-boot[data-failed='true'] #rezo360-style-retry {
        display: block;
      }
    </style>

    <!--
      Le titre porte la promesse, pas seulement la marque.

      « REZO360 » seul est ce que lit un visiteur dans son onglet, dans ses
      favoris et dans un résultat de recherche. Un nom de marque inconnu n'y
      dit rien de ce que fait le produit ni à qui il s'adresse.
    -->
    <title>REZO360 — Pilotez votre activité de terrain</title>
  </head>
  <body>
    <div id="rezo360-style-boot" role="status" aria-live="polite">
      <div class="rezo360-style-boot-card">
        <p class="rezo360-style-boot-logo">REZO<span>360</span></p>
        <p id="rezo360-style-message" class="rezo360-style-boot-message">
          Chargement de l’interface…
        </p>
        <button id="rezo360-style-retry" type="button">Réparer et recharger</button>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var documentElement = document.documentElement;
        var applicationRoot = document.getElementById('root');
        var bootScreen = document.getElementById('rezo360-style-boot');
        var message = document.getElementById('rezo360-style-message');
        var retryButton = document.getElementById('rezo360-style-retry');
        var retryInProgress = false;
        var automaticRetryDone = false;
        var readinessTimer = 0;
        var applicationTimer = 0;
        var APP_RECOVERY_KEY = 'rezo360_app_shell_recovery_at';
        var APP_RECOVERY_GUARD_MS = 60000;

        function stylesAreReady() {
          return (
            getComputedStyle(documentElement).getPropertyValue('--app-styles-ready').trim().length >
            0
          );
        }

        function revealApplication() {
          if (readinessTimer) window.clearInterval(readinessTimer);
          documentElement.classList.add('rezo360-styles-ready');
          if (applicationRoot && applicationRoot.childElementCount > 0) {
            if (applicationTimer) window.clearTimeout(applicationTimer);
            documentElement.classList.add('rezo360-app-ready');
          }
        }

        function showFailure(failureMessage) {
          retryInProgress = false;
          bootScreen.setAttribute('data-failed', 'true');
          message.textContent =
            failureMessage ||
            'L’interface n’a pas pu être chargée. Vérifiez votre connexion puis réessayez.';
        }

        function applicationHasStarted() {
          return Boolean(applicationRoot && applicationRoot.childElementCount > 0);
        }

        function reserveAutomaticRecovery() {
          try {
            var now = Date.now();
            var previousAttempt = Number(sessionStorage.getItem(APP_RECOVERY_KEY)) || 0;
            if (now - previousAttempt < APP_RECOVERY_GUARD_MS) return false;
            sessionStorage.setItem(APP_RECOVERY_KEY, String(now));
          } catch (error) {
            /* Le stockage privé ne doit pas empêcher une tentative de réparation. */
          }
          return true;
        }

        function reloadWithoutOldShell() {
          var nextUrl = new URL(window.location.href);
          nextUrl.searchParams.set('rezo360-recovery', String(Date.now()));
          window.location.replace(nextUrl.toString());
        }

        function repairApplicationShell(automatic) {
          if (retryInProgress || applicationHasStarted()) return;
          if (automatic && !reserveAutomaticRecovery()) {
            showFailure(
              'Une ancienne version bloque encore l’application. Touchez « Réparer et recharger » pour terminer la mise à jour.',
            );
            return;
          }

          retryInProgress = true;
          bootScreen.removeAttribute('data-failed');
          message.textContent = 'Mise à jour de l’application…';

          var cleanups = [];
          if ('caches' in window) {
            cleanups.push(
              caches.keys().then(function (keys) {
                return Promise.all(
                  keys
                    .filter(function (key) {
                      return key.indexOf('rezo360-pwa-') === 0;
                    })
                    .map(function (key) {
                      return caches.delete(key);
                    }),
                );
              }),
            );
          }
          if ('serviceWorker' in navigator) {
            cleanups.push(
              navigator.serviceWorker.getRegistrations().then(function (registrations) {
                return Promise.all(
                  registrations.map(function (registration) {
                    return registration.unregister();
                  }),
                );
              }),
            );
          }

          Promise.all(cleanups).then(reloadWithoutOldShell, reloadWithoutOldShell);
        }

        function mainStylesheet() {
          return document.querySelector('link[rel="stylesheet"][href*="/assets/"]');
        }

        function retryStylesheet() {
          if (retryInProgress) return;
          if (stylesAreReady()) {
            revealApplication();
            return;
          }

          var original = mainStylesheet();
          if (!original) {
            showFailure();
            return;
          }

          retryInProgress = true;
          bootScreen.removeAttribute('data-failed');
          message.textContent = 'Récupération de l’interface…';

          var recovered = original.cloneNode();
          var recoveredUrl = new URL(original.href, window.location.href);
          recoveredUrl.searchParams.set('rezo360-css-recovery', String(Date.now()));
          recovered.href = recoveredUrl.toString();
          recovered.setAttribute('data-rezo360-recovery', 'true');
          recovered.addEventListener('load', function () {
            retryInProgress = false;
            window.setTimeout(function () {
              if (stylesAreReady()) {
                original.remove();
                revealApplication();
              } else {
                recovered.remove();
                showFailure();
              }
            }, 0);
          });
          recovered.addEventListener('error', function () {
            retryInProgress = false;
            recovered.remove();
            showFailure();
          });
          original.after(recovered);
        }

        function checkReadiness() {
          if (stylesAreReady()) {
            revealApplication();
            return;
          }

          var stylesheet = mainStylesheet();
          if (stylesheet && !stylesheet.dataset.rezo360Observed) {
            stylesheet.dataset.rezo360Observed = 'true';
            stylesheet.addEventListener('load', checkReadiness);
            stylesheet.addEventListener('error', function () {
              if (!automaticRetryDone) {
                automaticRetryDone = true;
                retryStylesheet();
              } else {
                showFailure();
              }
            });
          }
        }

        if (applicationRoot) {
          new MutationObserver(function () {
            if (applicationHasStarted()) revealApplication();
          }).observe(applicationRoot, { childList: true });
        }

        /* Un ancien index peut référencer le fichier d’entrée d’un déploiement
           précédent. Comme ce fichier échoue AVANT l’exécution de main.tsx,
           seul ce script en ligne peut sortir l’utilisateur de l’écran blanc. */
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            if (
              target &&
              target.tagName === 'SCRIPT' &&
              (target.type === 'module' || String(target.src).indexOf('/assets/') >= 0)
            ) {
              repairApplicationShell(true);
            }
          },
          true,
        );

        retryButton.addEventListener('click', function () {
          if (!stylesAreReady()) retryStylesheet();
          else repairApplicationShell(false);
        });
        checkReadiness();
        readinessTimer = window.setInterval(checkReadiness, 100);
        window.setTimeout(function () {
          if (!stylesAreReady() && !automaticRetryDone) {
            automaticRetryDone = true;
            retryStylesheet();
          }
        }, 2500);
        applicationTimer = window.setTimeout(function () {
          if (!applicationHasStarted()) repairApplicationShell(true);
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
